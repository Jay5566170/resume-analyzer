<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #4fc3f7; color: #1a1a2e; }
        .btn-danger { background: #ef5350; color: white; }
        .resume-card { background: #fafafa; padding: 15px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 10px; }
        .skill-tag { display: inline-block; background: #e3f2fd; color: #0d47a1; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin: 2px; }
        .status { margin-top: 12px; padding: 10px; border-radius: 8px; }
        .status-success { background: #e8f5e9; color: #2e7d32; }
        .status-error { background: #ffebee; color: #c62828; }
        .status-loading { background: #e3f2fd; color: #0d47a1; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #e0e0e0; border-top: 2px solid #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Resume Analyzer</h1>

        <!-- UPLOAD -->
        <div class="card">
            <h2>📤 Upload Resume</h2>
            <div class="form-group">
                <input type="file" id="fileInput" accept=".pdf,.txt">
                <button class="btn btn-primary" id="uploadBtn">Upload & Analyze</button>
            </div>
            <div id="uploadStatus"></div>
        </div>

        <!-- SEARCH -->
        <div class="card">
            <h2>🔍 Search</h2>
            <div class="form-group">
                <input type="text" id="searchInput" placeholder="Search by name, email, or skill..." style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;">
                <button class="btn btn-primary" id="searchBtn">Search</button>
                <button class="btn" id="clearSearchBtn" style="background:#ddd;">Clear</button>
            </div>
        </div>

        <!-- LIST -->
        <div class="card">
            <h2>📋 All Resumes</h2>
            <div id="resumeList"><p>Loading...</p></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        // Make sure elements exist
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadStatus = document.getElementById('uploadStatus');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const resumeList = document.getElementById('resumeList');

        console.log('✅ JavaScript loaded!');

        // ---- LOAD RESUMES ----
        async function loadResumes(query = '') {
            resumeList.innerHTML = '<p>Loading...</p>';
            try {
                let url = `${API_URL}/resumes/`;
                if (query) url = `${API_URL}/resumes/search/?q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch');
                const resumes = await response.json();
                if (!resumes.length) {
                    resumeList.innerHTML = `<p>${query ? 'No results found for "' + query + '"' : 'No resumes uploaded yet.'}</p>`;
                    return;
                }
                resumeList.innerHTML = resumes.map(r => `
                    <div class="resume-card">
                        <h3>${r.name || 'Unnamed'}</h3>
                        <p><strong>File:</strong> ${r.filename}</p>
                        ${r.email ? `<p><strong>Email:</strong> ${r.email}</p>` : ''}
                        ${r.skills ? `<p><strong>Skills:</strong> ${JSON.parse(r.skills).map(s => `<span class="skill-tag">${s}</span>`).join(' ')}</p>` : ''}
                        ${r.summary ? `<p><strong>Summary:</strong> ${r.summary}</p>` : ''}
                        <button class="btn btn-danger" onclick="deleteResume(${r.id})">Delete</button>
                    </div>
                `).join('');
            } catch (error) {
                resumeList.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            }
        }

        // ---- UPLOAD ----
        async function handleUpload() {
            console.log('📤 Upload button clicked!');
            const file = fileInput.files[0];
            if (!file) {
                showStatus(uploadStatus, 'Please select a file.', 'error');
                return;
            }
            console.log('📄 File selected:', file.name);

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';
            showStatus(uploadStatus, 'Uploading...', 'loading');

            const formData = new FormData();
            formData.append('file', file);

            try {
                console.log('📤 Sending to API...');
                const response = await fetch(`${API_URL}/resumes/upload`, {
                    method: 'POST',
                    body: formData,
                });
                console.log('📥 Response status:', response.status);

                if (!response.ok) throw new Error('Upload failed');
                const data = await response.json();
                console.log('✅ Upload success:', data);

                showStatus(uploadStatus, `✅ Uploaded: ${data.filename} (ID: ${data.id})`, 'success');
                fileInput.value = '';

                // Analyze
                uploadBtn.innerHTML = '<span class="spinner"></span> Analyzing...';
                showStatus(uploadStatus, '🔍 Analyzing with AI...', 'loading');

                const analyzeResponse = await fetch(`${API_URL}/resumes/analyze/${data.id}`, {
                    method: 'POST',
                });
                const analyzed = await analyzeResponse.json();
                console.log('✅ Analysis success:', analyzed);
                showStatus(uploadStatus, `✅ Analysis complete! ${analyzed.name || 'Unnamed'}`, 'success');
                loadResumes();

            } catch (error) {
                console.error('❌ Error:', error);
                showStatus(uploadStatus, `❌ Error: ${error.message}`, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Analyze';
            }
        }

        // ---- DELETE ----
        async function deleteResume(id) {
            if (!confirm('Delete resume?')) return;
            try {
                await fetch(`${API_URL}/resumes/${id}`, { method: 'DELETE' });
                loadResumes();
            } catch (error) {
                alert('Delete failed: ' + error.message);
            }
        }

        // ---- SEARCH ----
        function handleSearch() {
            const query = searchInput.value.trim();
            loadResumes(query || '');
        }

        function clearSearch() {
            searchInput.value = '';
            loadResumes();
        }

        // ---- STATUS HELPER ----
        function showStatus(element, message, type) {
            element.innerHTML = `<div class="status status-${type}">${message}</div>`;
        }

        // ---- EVENT LISTENERS ----
        uploadBtn.addEventListener('click', handleUpload);
        searchBtn.addEventListener('click', handleSearch);
        clearSearchBtn.addEventListener('click', clearSearch);
        searchInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') handleSearch();
        });

        // ---- LOAD ON PAGE LOAD ----
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🔄 Page loaded, fetching resumes...');
            loadResumes();
        });
    </script>
</body>
</html>
